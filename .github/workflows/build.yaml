name: Build APK

on:
  # push:
    # branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Repo không chứa thư mục android/ -> tự sinh khi build.
      - name: Tạo nền tảng Android nếu chưa có
        run: |
          if [ ! -d android ]; then
            flutter create . --platforms=android --org com.giapha --project-name gia_pha
            rm -f test/widget_test.dart
            sed -i 's/android:label="[^"]*"/android:label="Gia phả"/' android/app/src/main/AndroidManifest.xml
          fi

      - run: flutter pub get

      # Hai bước dưới chưa chặn build. Khi đã xanh ổn định, bỏ continue-on-error.
      - name: Analyze
        run: flutter analyze --no-fatal-infos
        continue-on-error: true

      - name: Test
        run: flutter test
        continue-on-error: true

      - name: Build APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: gia-pha-apk
          path: build/app/outputs/flutter-apk/app-release.apk
